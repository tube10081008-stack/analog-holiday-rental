<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14161C" />
  <link rel="manifest" href="/german/manifest.webmanifest" />
  <link rel="icon" href="/german/icon-192.png" />
  <link rel="apple-touch-icon" href="/german/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="레나의 독일어 노트" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>레나의 독일어 노트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/german/german.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <p class="gate-eyebrow">ÜBUNGSGRAMMATIK</p>
      <h1 class="gate-title">레나의<br/>독일어 노트</h1>
      <p class="gate-sub">Regeln · Listen · Übungen<br/>조교이자 스파링 파트너, 레나와 함께</p>
      <p class="gate-hint">초대받으셨다면 받은 키를 그대로 넣으세요.</p>
      <input id="keyInput" type="password" placeholder="내 키" autocomplete="current-password" />
      <button id="enterBtn" class="btn-primary">노트 펼치기</button>
      <p id="gateError" class="gate-error" hidden></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-sub">레나의 독일어 노트 <b id="whoami"></b></span>
        <span class="brand-main" id="chapterLabel">—</span>
      </div>
      <div class="stat-strip" id="statStrip"></div>
    </header>

    <div class="xp-bar" id="xpBar" hidden>
      <div class="xp-lv"><b id="xpLevel">1</b><span>LV</span></div>
      <div class="xp-track"><i id="xpFill"></i></div>
      <span class="xp-text" id="xpText">0 / 150</span>
    </div>

    <nav class="tabs">
      <button data-tab="today" class="active">오늘 수업</button>
      <button data-tab="map">목차</button>
      <button data-tab="review">복습 <span id="dueBadge" class="badge" hidden>0</span></button>
      <button data-tab="collection">도감</button>
      <button data-tab="notebook">내 노트 <span id="nbBadge" class="badge" hidden>0</span></button>
      <button data-tab="together">함께 <span id="tgBadge" class="badge" hidden>0</span></button>
      <button data-tab="gaps">약한 곳</button>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <script>
    // 서비스 워커 — 홈 화면에서 앱처럼 열고, 끊겨도 마지막 화면은 뜨게 합니다.
    // 화면 파일은 네트워크 우선이라 배포하면 바로 최신이 반영됩니다.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('/german/sw.js', { scope: '/german/' })
          .catch((e) => console.warn('[PWA] 등록 실패:', e.message));
      });
    }
  </script>
  <script type="module" src="/german/german.js"></script>
</body>
</html>
