<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A1210" />
  <title>陈老师 중국어 학당</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/chinese/chinese.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <p class="gate-eyebrow">CHINESE ACADEMY</p>
      <h1 class="gate-title">陈老师<br/>중국어 학당</h1>
      <p class="gate-sub">천야린 선생님의 1:1 지도<br/>한국인 학습자 전용 과정</p>
      <input id="keyInput" type="password" placeholder="관리자 키" autocomplete="current-password" />
      <button id="enterBtn" class="btn-primary">교실 들어가기</button>
      <p id="gateError" class="gate-error" hidden></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-sub">陈老师 중국어 학당</span>
        <span class="brand-main" id="levelLabel">—</span>
      </div>
      <div class="stat-strip" id="statStrip"></div>
    </header>

    <div class="xp-bar" id="xpBar" hidden>
      <div class="xp-lv"><b id="xpLevel">1</b><span>LV</span></div>
      <div class="xp-track"><i id="xpFill"></i></div>
      <span class="xp-text" id="xpText">0 / 150</span>
    </div>

    <nav class="tabs">
      <button data-tab="today" class="active">수업</button>
      <button data-tab="review">복습 <span id="dueBadge" class="badge" hidden>0</span></button>
      <button data-tab="stage">스테이지</button>
      <button data-tab="collection">도감</button>
      <button data-tab="history">기록</button>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <script type="module" src="/chinese/chinese.js"></script>
</body>
</html>
